name: 사이트 배포 (GitHub Pages)

on:
  push:
    branches: [main, claude/festive-sagan-4tmxys]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 개발 기간에는 '가짜 데이터' 버튼을 보이게 함. 최종 배포 때 이 줄을 지우면 숨겨짐.
      - run: npm run build
        env:
          VITE_SHOW_DEV_TOOLS: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
